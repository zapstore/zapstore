org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
android.enableR8.fullMode=true
android.r8.strictFullModeForKeepRules=true
# connectedAndroidTest uninstalls the app when the run ends unless this is set.
android.injected.androidTest.leaveApksInstalledAfterRun=true
# The catalog bundle the bundle APK ships (-PcatalogBundle=pinned). infra/misc/cut-mobile-release.sh writes both
# lines at release time; Gradle fetches the URL and refuses anything whose sha256 differs. Empty means no pin.
catalogPinSha256=795bfd674a8c0ca5bc0a97d0d8de59fe25f53c0cab50aa320bf1f23538e4d0f6
catalogPinUrl=https://zapstore.dev/downloads/catalog-1550.tar.zst
